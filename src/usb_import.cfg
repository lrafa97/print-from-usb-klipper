# Intercepts print start (Mainsail and KlipperScreen both use
# SDCARD_PRINT_FILE). Files under USB/ are copied by Moonraker (the usb_import
# component), which then starts the print from the local copy.
# Every other request is passed straight to the original command.
[gcode_macro SDCARD_PRINT_FILE]
rename_existing: _USB_IMPORT_SDCARD_PRINT_FILE
gcode:
  {% set fn = params.FILENAME|default('')|string %}
  {% if fn.startswith('USB/') %}
    {action_call_remote_method("usb_import_print", filename=fn)}
  {% else %}
    _USB_IMPORT_SDCARD_PRINT_FILE {rawparams}
  {% endif %}
